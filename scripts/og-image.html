<!doctype html>
<!--
  The share image for every arcade page (public/og-image.png, 1200 by 630).
  The handheld is the one the lobby card on lucasflatwhite.com draws.
  To redraw it, open this file in Chrome at a 1200 by 630 window and save a
  screenshot of the page over public/og-image.png.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Flatwhite Arcade share image</title>
<style>
  @font-face { font-family: 'Anybody'; font-weight: 100 900; font-stretch: 50% 150%; src: url(../node_modules/@fontsource-variable/anybody/files/anybody-latin-wdth-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Roboto Mono'; font-weight: 400; src: url(../node_modules/@fontsource/roboto-mono/files/roboto-mono-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Roboto Mono'; font-weight: 500; src: url(../node_modules/@fontsource/roboto-mono/files/roboto-mono-latin-500-normal.woff2) format('woff2'); }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: linear-gradient(to top, rgba(23, 23, 23, 0.04), rgba(23, 23, 23, 0) 35%), #f4f4f2;
    color: #171717; font-family: 'Anybody', system-ui, sans-serif;
  }
  .copy { position: absolute; left: 88px; top: 96px; width: 600px; }
  .tags { display: flex; gap: 12px; margin: 0 0 30px; font-family: 'Roboto Mono', monospace; font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; }
  .tags span { padding: 6px 14px; border-radius: 999px; background: #ffc457; color: #171717; }
  h1 { margin: 0; font-size: 104px; line-height: 0.92; font-weight: 720; font-stretch: 125%; letter-spacing: -0.035em; }
  p.line { margin: 34px 0 0; max-width: 600px; color: #4d4d4d; font-size: 30px; line-height: 1.35; }
  .url { position: absolute; left: 88px; bottom: 64px; font-family: 'Roboto Mono', monospace; font-size: 18px; letter-spacing: 0.12em; color: #8a8a86; text-transform: lowercase; }
  .hand { position: absolute; right: 120px; top: 52px; height: 526px; aspect-ratio: 410 / 720; }
  .hand svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 26px 34px rgba(23, 23, 23, 0.18)); }
  .hand text { font-family: 'Anybody', system-ui, sans-serif; }
  .hand .arcade-small { letter-spacing: 0.14em; }
  .hand .arcade-logo { font-stretch: 125%; font-weight: 720; letter-spacing: -0.03em; }
  .hand .arcade-logo .arcade-small { font-stretch: 100%; font-weight: 400; letter-spacing: 0.2em; }
</style>
</head>

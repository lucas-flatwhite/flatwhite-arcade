  <body class="lobby">
    <header class="lobby-strip">
      <a class="lobby-home" href="https://lucasflatwhite.com/">/lucas-flatwhite</a>
    </header>
    <main class="lobby-floor">
      <h1 class="lobby-title">Flatwhite Arcade</h1>
      <p class="lobby-intro">Small games, one cabinet at a time.</p>
      <ol class="cabinets">
        <li class="cabinet">
          <a class="cabinet-link" href="/arcade/snake/">
            <span class="cabinet-number">01</span>
            <span class="cabinet-name">Snake</span>
            <span class="cabinet-summary">Steer through a field of Korean and English words and race a CPU rival to the same food.</span>
          </a>
        </li>
        <li class="cabinet cabinet-empty" aria-label="Next cabinet, coming later">
          <span class="cabinet-number">02</span>
          <span class="cabinet-name">Next cabinet</span>
          <span class="cabinet-summary">Being built.</span>
        </li>
      </ol>
    </main>
    <script type="module" src="/src/lobby/main.ts"></script>
